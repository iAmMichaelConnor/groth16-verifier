name: Noir tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MINIMUM_NOIR_VERSION: 1.0.0-rc.3

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.MINIMUM_NOIR_VERSION }}

      - name: Run formatter
        run: nargo fmt --check

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install generator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/groth16-verifier-hints

      - name: Check generated files
        run: python3 scripts/generate.py --check

  # One job per package and toolchain: the minimum supported Noir (1.0.0-rc.3, which Aztec 6.0.0 ships) and the
  # latest release; nightly-canary.yml covers Noir nightly. Each package runs in its per-pull-request mode
  # (CONTRIBUTING.md#tests) with four test threads, the vCPUs of a hosted runner. bignum runs constrained, because
  # its tests feed malicious hints and expect a failed constraint.
  test:
    name: Test ${{ matrix.package }} on Nargo ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.0.0-rc.3, 1.0.0]
        package:
          - bn254_fields
          - bn254_fields_slow_tests
          - bn254_g1
          - bn254_g2
          - bn254_pairing
          - runtime_key_schema
          - sp1
          - bignum
          - fixed_g1_helpers
          - runtime_g1
          - transcript_packing
          - fixed_multiplier_vector
          - runtime_multiplier_vector
          - sp1_v6_vector
        include:
          - package: bignum
            constrained: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Run tests
        if: ${{ !matrix.constrained }}
        run: nargo test --force-brillig --inliner-aggressiveness 0 --package ${{ matrix.package }} --test-threads 4

      - name: Run tests constrained
        if: ${{ matrix.constrained }}
        run: nargo test --package ${{ matrix.package }} --test-threads 4

  # Type-checks every workspace member, including the packages without tests and
  # the API typecheck crates, and checks that partial verifier helpers stay private.
  check:
    name: Check workspace on Nargo ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.0.0-rc.3, 1.0.0]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Check workspace
        run: nargo check --workspace

      - name: Check public API visibility
        run: ./scripts/check-public-api.sh

  # Host-side code: the hint SDKs, the key and vector generators' Python, and
  # the arguments behind the unguarded pairing schedule. The `test_*.py`
  # modules in scripts/tests take about a minute and under 1 GB; the
  # `heavy_*.py` module runs the proof-vector packages in the nightly workflow.
  # The oracle tests compare the BN254 tower and pairing with @noble/curves
  # through a local oracle server (tests/bn254_oracle_tests/run.sh).
  host:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nargo
        uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ env.MINIMUM_NOIR_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/groth16-verifier-hints
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/groth16-verifier-sp1
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/bn254_oracle_tests

      - name: Hint SDK tests
        run: |
          npm run check:dist --prefix packages/groth16-verifier-hints
          npm run test:fast --prefix packages/groth16-verifier-hints
          npm test --prefix packages/groth16-verifier-sp1

      - name: Python tests
        run: |
          python3 -B -m unittest discover -s packages/groth16-verifier-hints/python/groth16/tests -p 'test_*.py'
          python3 -B -m unittest discover -s packages/groth16-verifier-sp1/python/tests -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Oracle tests
        run: tests/bn254_oracle_tests/run.sh

  # This is a job which depends on all test jobs and reports the overall status.
  # This allows us to add/remove test jobs without having to update the required workflows.
  tests-end:
    name: Noir End
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # We want this job to always run (even if the dependant jobs fail) as we want this job to fail rather than skipping.
    if: ${{ always() }}
    needs:
      - format
      - test
      - check
      - host

    steps:
      - name: Report overall success
        run: |
          if [[ $FAIL == true ]]; then
              exit 1
          else
              exit 0
          fi
        env:
          # A failed or cancelled job fails the workflow; a skipped job does not.
          FAIL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
